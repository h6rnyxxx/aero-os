# Конфигурационный файл WinApps для AeroOS
# Используется для бесшовной интеграции тяжелых Windows-приложений (Office 365, Adobe CC)
# через KVM/QEMU и FreeRDP RAIL

# Параметры подключения к виртуальной машине Windows (Tiny11 / AtlasOS)
RDP_USER="AeroUser"
RDP_PASS="aero"
RDP_DOMAIN=""
RDP_IP="192.168.122.100"

# Масштабирование дисплея (100%, 125%, 150%)
RDP_SCALE="100"

# Флаги FreeRDP для аппаратного ускорения и бесшовных окон
RDP_FLAGS="/cert:tofu /sound:sys:pulse /microphone:sys:pulse +clipboard +auto-reconnect /bpp:32 /network:auto +fonts"

# Автоматический запуск виртуальной машины при клике по ярлыку приложения
AUTOTRIGGER_VM="true"
VM_NAME="AeroWinAppsVM"
