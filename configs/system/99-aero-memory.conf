# Оптимизация подсистемы виртуальной памяти AeroOS под 2-4 ГБ ОЗУ

# 1. Агрессивный сброс анонимной памяти в быстрый сжатый zRAM пул
vm.swappiness = 160

# 2. Чтение страниц из swap без упреждающего кластера (оптимально для zRAM в памяти)
vm.page-cluster = 0

# 3. Баланс дискового кэша: защита от долгого I/O подвисания при записи на медленный диск
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# 4. Удержание метаданных файлов в памяти для мгновенного отклика оболочки
vm.vfs_cache_pressure = 50

# 5. Защита от истощения памяти ядра
vm.min_free_kbytes = 65536
