# Конфигурация zRAM модуля ядра для AeroOS
# Превращает 2 ГБ физической памяти в виртуальные ~4-5 ГБ за счет сжатия zstd

[zram0]
# Размер пула сжатия: 150% от физического объема ОЗУ (до макс. 6 ГБ)
zram-size = min(ram * 1.5, 6144)

# Самый быстрый и эффективный алгоритм сжатия
compression-algorithm = zstd

# Наивысший приоритет swap-устройства
swap-priority = 100
