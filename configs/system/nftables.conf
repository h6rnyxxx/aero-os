#!/usr/sbin/nft -f
# Легковесный файрвол AeroOS (замена тяжелого демона firewalld, экономия ~60 МБ RAM)

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Разрешить трафик локальной петли (loopback)
        iif "lo" accept

        # Разрешить уже установленные и связанные соединения
        ct state established,related accept

        # Отбросить некорректные пакеты
        ct state invalid drop

        # Разрешить ICMP (пинг)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Разрешить DHCP клиент
        udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
